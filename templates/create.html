<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать обращение</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Цифровой помощник колледжа</h1>
        <h2>Новое обращение</h2>

        <form action="{{ url_for('create_page') }}" method="POST">
            <!-- Краткая суть проблемы (Заголовок) -->
            <div class="form-group">
                <label for="title">Что случилось? (Кратко):</label>
                <input type="text" id="title" name="title" required placeholder="Например: Не работает проектор">
            </div>

            <!-- Полное описание проблемы -->
            <div class="form-group">
                <label for="description">Подробное описание:</label>
                <textarea id="description" name="description" rows="4" placeholder="Опишите детали проблемы..."></textarea>
            </div>

            <!-- Выпадающий список категорий из базы данных -->
            <div class="form-group">
                <label for="category_id">Категория неисправности:</label>
                <select id="category_id" name="category_id" required>
                    <option value="">-- Выберите категорию --</option>
                    {% for category in categories %}
                        <option value="{{ category.id }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Выпадающий список локаций (кабинетов) из базы данных -->
            <div class="form-group">
                <label for="location_id">Помещение / Кабинет:</label>
                <select id="location_id" name="location_id" required>
                    <option value="">-- Выберите кабинет --</option>
                    {% for loc in locations %}
                        <option value="{{ loc.id }}">{{ loc.building }}, эт. {{ loc.floor }}, каб. {{ loc.room }} ({{ loc.zone_name }})</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn-submit">Отправить заявку</button>
        </form>
    </div>
</body>
</html>
