<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подача обращения</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div style="margin-bottom: 20px;">
            <!-- Ссылка ведет на главную или на роут проверки статуса -->
            <a href="{{ url_for('check_status') }}" style="color: var(--primary); text-decoration: none;">&larr; Проверить статус существующей заявки</a>
        </div>
        
        <div class="status-card">
            <h2>Новое обращение</h2>
            <p>Пожалуйста, опишите вашу проблему или задайте вопрос как можно подробнее.</p>
            
            <!-- Форма отправляет POST запрос на роут обработки ввода /create -->
            <form action="/create" method="POST" style="margin-top: 20px;">
                <div class="form-group">
                    <label for="location">Помещение</label>
                    <select name="location_id" id="location" required>
                        <!-- Если комната передана через QR, выводим её как единственную и выбранную -->
                        {% if active_location %}
                            <option value="{{ active_location.id }}" selected>Кабинет {{ active_location.room }} ({{ active_location.building }})</option>
                        {% else %}
                            <option value="" disabled selected>-- Выберите локацию --</option>
                            <!-- Динамический список локаций, если открыли общую форму без QR -->
                            {% if locations %}
                                {% for loc in locations %}
                                    <option value="{{ loc.id }}">Кабинет {{ loc.room }} ({{ loc.building }})</option>
                                {% endfor %}
                            {% else %}
                                <option value="1">Кабинет 214 (Главный корпус)</option>
                                <option value="2">Кабинет 305 (Лабораторный корпус)</option>
                                <option value="3">Общая зона (Холл)</option>
                            {% endif %}
                        {% endif %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="user_text">Описание проблемы или ваш вопрос</label>
                    <!-- Переменная name изменена на user_text, чтобы совпадать с логикой приема роута -->
                    <textarea name="user_text" id="user_text" placeholder="Например: Из розетки идет искрение... или Как подключить ноутбук к проектору?" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-block mt-4">Отправить ИИ на проверку</button>
            </form>
        </div>
    </div>
</body>
</html>
