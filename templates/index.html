<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цифровой помощник колледжа</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Кнопка переключения темы (текстовая) -->
    <button id="theme-toggle" class="theme-toggle">Сменить тему</button>

    <!-- Основной контейнер (только один!) -->
    <div class="container">
        <div class="hero">
            <h1>УПК: Цифровой помощник</h1>
            <p>Единый центр обращений по вопросам состояния помещений, оборудования и инфраструктуры колледжа.</p>
            
            <div class="hero-buttons">
                <a href="/create" class="btn btn-primary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                    Подать обращение
                </a>
                <a href="/status" class="btn btn-outline">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    Проверить статус
                </a>
                <a href="/admin" class="btn btn-outline">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    Панель сотрудника
                </a>
            </div>
        </div>
    </div>

       <!-- Скрипт для переключения темы -->
        <script>
        const toggleBtn = document.getElementById('theme-toggle');
        
        // Проверяем, есть ли сохраненная тема. Если нет — ставим темную по умолчанию.
        const currentTheme = localStorage.getItem('theme') || 'dark';

        // Если сохранена светлая тема, применяем её при загрузке
        if (currentTheme === 'light') {
            document.body.setAttribute('data-theme', 'light');
        } else {
            document.body.removeAttribute('data-theme');
        }

        // Обработчик клика по кнопке
        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                if (document.body.getAttribute('data-theme') === 'light') {
                    document.body.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'dark'); // Запоминаем темную
                } else {
                    document.body.setAttribute('data-theme', 'light');
                    localStorage.setItem('theme', 'light'); // Запоминаем светлую
                }
            });
        }
    </script>
</body>
</html>
